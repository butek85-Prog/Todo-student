services:
  - type: web
    name: todo-student
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEFAULT_USER_ID
        value: "5265404800"
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
